# CI estático do catálogo "tools": sem build; npm ci só instala as ferramentas de desenvolvimento (eslint e prettier).
# Roda docs/claudeia/verificar.ps1 (pwsh já vem no ubuntu-latest) e checa a sintaxe dos módulos JS com o node do runner.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependências de desenvolvimento (lint e formato)
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Formato (prettier)
        run: npm run format:check

      - name: Verificações estáticas (arquivos, dados, manifest)
        shell: pwsh
        run: ./docs/claudeia/verificar.ps1

      - name: Sintaxe dos módulos JS
        run: |
          set -e
          for f in main.js js/*.js data/*.js; do
            node --input-type=module --check < "$f"
            echo "ok $f"
          done

      - name: Testes (node --test)
        run: npm test
